services:
  obox-backend:
    image: ${DOCKERHUB_USERNAME:-ch1mple}/oboxsteam-api:${IMAGE_TAG:-latest}
    container_name: obox-backend
    build:
      context: .
      dockerfile: OboxSteam.API/Dockerfile
    restart: unless-stopped
    depends_on:
      oboxsteam.database:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
      # - ConnectionStrings__Redis=oboxsteam-redis:6379,abortConnect=false
      - JWT__SecretKey=${JWT__SecretKey}
      - JWT__Issuer=${JWT__Issuer}
      - JWT__Audience=${JWT__Audience}
      - JaaS__AppId=${JaaS__AppId}
      - JaaS__KeyId=${JaaS__KeyId}
      - JaaS__PrivateKeyPath=${JaaS__PrivateKeyPath:-}
      - JaaS__PrivateKey=${JaaS__PrivateKey:-}
      - JaaS__Domain=${JaaS__Domain:-8x8.vc}
      - RESEND_APITOKEN=${RESEND_APITOKEN}
      - RESEND_FROM=${RESEND_FROM}
      - APP_BASE_URL=${APP_BASE_URL}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_MEDIACONVERT_ENDPOINT=${AWS_MEDIACONVERT_ENDPOINT}
      - AWS_MEDIACONVERT_ROLE_ARN=${AWS_MEDIACONVERT_ROLE_ARN}
      - AWS_SNS_TOPIC_ARN=${AWS_SNS_TOPIC_ARN}
      - AWS_REKOGNITION_ROLE_ARN=${AWS_REKOGNITION_ROLE_ARN}
      - BEDROCK_API_KEY=${BEDROCK_API_KEY}
      - BEDROCK_MANTLE_REGION=${BEDROCK_MANTLE_REGION}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
    ports:
      - "${API_PORT}:5000"
    # VPS/production: mount PEM read-only and set JaaS__PrivateKeyPath=/app/secrets/jaas-private.pem
    # volumes:
    #   - /opt/oboxsteam-be/secrets/jaas-private.pem:/app/secrets/jaas-private.pem:ro
    networks:
      - oboxsteam-network

  oboxsteam.database:
    image: postgres:15
    container_name: oboxsteam-database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oboxsteam-network

  # redis:
  #   image: redis:7.2-alpine
  #   container_name: oboxsteam-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6380:6379"
  #   command: >
  #     redis-server
  #     --maxmemory 512mb
  #     --maxmemory-policy allkeys-lru
  #   volumes:
  #     - redis-data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10
  #   networks:
  #     - oboxsteam-network

volumes:
  pgdata:
  # redis-data:

networks:
  oboxsteam-network:
    driver: bridge
