services:
  oboxsteam.api:
    image: ${DOCKER_REGISTRY-}oboxsteamapi
    container_name: oboxsteam-api
    build:
      context: .
      dockerfile: OboxSteam.API/Dockerfile
    restart: unless-stopped
    depends_on:
      oboxsteam.database:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ConnectionStrings__DefaultConnection=${CONNECTION_STRING}
      - ConnectionStrings__Redis=${REDIS_CONNECTION}
      - JWT__SecretKey=${JWT_SECRET_KEY}
      - JWT__Issuer=${JWT_ISSUER}
      - JWT__Audience=${JWT_AUDIENCE}
      - RESEND_APITOKEN=${RESEND_APITOKEN}
      - RESEND_FROM=${RESEND_FROM}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_HOST=${MINIO_HOST}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - AWS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - AWS_SECRET_KEY=${AWS_SECRET_KEY}
      - AWS_REGION=${AWS_REGION}
      - CORS_ALLOWED_ORIGIN=${CORS_ALLOWED_ORIGIN}
      - APP_BASE_URL=${APP_BASE_URL}
    ports:
      - "5000:5000"
    networks:
      - oboxsteam-network

  oboxsteam.database:
    image: postgres:15
    container_name: oboxsteam-database
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oboxsteam-network

  redis:
    image: redis:7.2-alpine
    container_name: oboxsteam-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - oboxsteam-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: oboxsteam-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oboxsteam-network

volumes:
  pgdata:
  redis-data:
  minio-data:

networks:
  oboxsteam-network:
    driver: bridge
