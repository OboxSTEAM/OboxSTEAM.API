name: Docker Build, Push and Deploy Obox Backend

on:
    push:
        branches:
            - main

jobs:
    build-push-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: OboxSteam.API/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/oboxsteam-api:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy to VPS via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: 22
                  script: |
                      set -e # Thêm chốt chặn bảo vệ: Lỗi bước nào là dừng luôn bước đó để dễ debug

                      # 1. Di chuyển vào thư mục chứa Backend trên VPS
                      cd /home/ubuntu/projects/oboxsteam-be

                      # 2. Đăng nhập DockerHub trên VPS để có quyền kéo image về (nếu repo ở chế độ private)
                      echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

                      # 3. Kéo duy nhất Image Backend mới đã được build sẵn từ DockerHub về VPS
                      echo "Pulling latest Obox Backend Docker image..."
                      docker compose pull oboxsteam.api

                      # 4. Khởi động lại container API và Database bằng Image mới
                      echo "Restarting Obox Backend containers..."
                      docker compose up -d

                      # 5. Dọn dẹp triệt để các Image cũ/bị rác để giải phóng ổ cứng
                      echo "Cleaning up old images..."
                      docker image prune -af 

                      # 6. Kiểm tra log của container để chắc chắn kết nối DB và AWS ổn định
                      echo "Checking logs for errors..."
                      docker logs --tail 20 oboxsteam-api
