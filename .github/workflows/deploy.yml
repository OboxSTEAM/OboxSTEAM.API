name: Docker Build, Push and Deploy Obox Backend

on:
    push:
        branches:
            - main

jobs:
    build-push-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to DockerHub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and Push Docker Image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: OboxSteam.API/Dockerfile
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/oboxsteam-api:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Deploy to VPS via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VPS_HOST }}
                  username: ${{ secrets.VPS_USER }}
                  key: ${{ secrets.VPS_SSH_KEY }}
                  port: 22
                  script: |
                    set -e
                    cd /root/apps/oboxsteam/oboxsteam-be
                    
                    echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
                    
                    echo "Pulling latest image..."
                    docker compose pull obox-backend
                    
                    echo "Recreating container..."
                    # Added --force-recreate to ensure Docker drops the old container entirely
                    docker compose up -d --force-recreate obox-backend
                    
                    echo "Cleaning up old images..."
                    docker image prune -af
                    
                    echo "Checking container status and logs..."
                    sleep 3
                    docker ps -a --filter name=obox-backend
                    docker logs --tail 50 obox-backend